[package]
name = "scrapix-billing-hyperline"
description = "Hyperline billing provider: typed client, webhook verification, usage event outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scrapix-core = { path = "../scrapix-core" }

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls"] }

# Webhook signature verification (HMAC-SHA256)
hmac = "0.12"
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = "2.6"

[dev-dependencies]
tokio = { workspace = true }
