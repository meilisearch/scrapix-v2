[package]
name = "scrapix-billing"
description = "Billing, credit ledger, and payment logic for Scrapix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scrapix-core = { path = "../scrapix-core" }

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# NOTE: async-stripe dependency was removed during the Hyperline migration.
# The ledger no longer knows or cares about Stripe specifically — it accepts
# a provider-agnostic (provider, event_id) pair for idempotency.
