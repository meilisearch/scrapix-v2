# scrapix-worker-content — Kafka consumer that parses HTML into documents.
# Horizontal scaling: `flyctl scale count N -a scrapix-worker-content`.
# Max useful N = partition count of scrapix.pages.raw (6).

app = "scrapix-worker-content"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[[services]]
  protocol = "tcp"
  internal_port = 8081
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8081
    handlers = []

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[env]
  RUST_LOG = "info"
  KAFKA_GROUP_ID = "scrapix-content"
  BATCH_SIZE = "2000"
  BATCH_TIMEOUT_SECS = "5"
  IDLE_EXIT_MINUTES = "0"
  WAKE_PORT = "8081"
