# scrapix-worker-crawler — Kafka consumer that fetches pages (includes Chromium).
# Horizontal scaling: `flyctl scale count N -a scrapix-worker-crawler`.
# Max useful N = partition count of scrapix.urls.frontier (12).

app = "scrapix-worker-crawler"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

# Wake service: bare TCP on port 8081. Fly's proxy autostarts the machine on
# incoming connections (the API fans out wakes on POST /crawl). When the
# worker is idle for IDLE_EXIT_MINUTES it exits cleanly and Fly suspends it.
[[services]]
  protocol = "tcp"
  internal_port = 8081
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8081
    handlers = []

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpus = 2

[env]
  RUST_LOG = "info"
  KAFKA_GROUP_ID = "scrapix-crawlers"
  CONCURRENCY = "50"
  USER_AGENT = "Scrapix/1.0 (compatible; +https://github.com/quentindequelen/scrapix)"
  REQUEST_TIMEOUT = "30"
  MAX_RETRIES = "3"
  RESPECT_ROBOTS = "true"
  IDLE_EXIT_MINUTES = "10"
  WAKE_PORT = "8081"
