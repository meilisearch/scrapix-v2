# scrapix-frontier — URL frontier singleton (bloom filter owns in-memory state).
# DO NOT scale beyond 1 machine: the bloom filter is per-process state and
# parallel instances would skip dedup for URLs the other has already seen.

app = "scrapix-frontier"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[[services]]
  protocol = "tcp"
  internal_port = 8081
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8081
    handlers = []

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

[env]
  RUST_LOG = "info"
  KAFKA_GROUP_ID = "scrapix-frontier"
  DISPATCH_INTERVAL_MS = "20"
  DISPATCH_BATCH_SIZE = "2000"
  DOMAIN_DELAY_MS = "50"
  CONCURRENT_PER_DOMAIN = "50"
  BLOOM_CAPACITY = "100000000"
  BLOOM_FP_RATE = "0.001"
  IDLE_EXIT_MINUTES = "0"
  WAKE_PORT = "8081"
